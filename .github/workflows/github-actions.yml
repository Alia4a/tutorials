name: github-actions
run-name: ${{ github.actor }} is testing odoo addons
'on': [push, pull_request]

permissions:
  contents: read

jobs:
  test-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install XML validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Python syntax check
        run: python -m compileall estate estate_account meeting_schedule

      - name: XML syntax check
        run: |
          find estate estate_account meeting_schedule -name '*.xml' -exec xmllint --noout {} +
          echo "All XML OK"